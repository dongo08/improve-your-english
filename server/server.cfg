# 账号服务端启动配置（改完重新双击 start_server.bat 即可）
# 值不要加引号；# 开头是注释。

# 账号服务端口（游戏客户端「在线模式」里填这个）
port=9000

# 网页面板端口
web_port=8080

# 面板管理员密码。留空 = 面板只有本机能打开；填了会自动监听 0.0.0.0 并要求登录
admin_password=

# 账号数据文件。留空 = user://server/accounts.json
# 也可以写绝对路径，例如：D:/game-data/accounts.json
data=

# Godot 可执行文件。留空 = 自动查找（也支持环境变量 GODOT_BIN）
godot=

# 启动后自动打开面板网页：1 = 打开，0 = 不打开
open_panel=1
